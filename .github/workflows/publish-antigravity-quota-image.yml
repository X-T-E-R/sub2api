name: Publish Antigravity quota image

on:
  push:
    tags:
      - "xter-image-antigravity-quota-bc8d21624"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/x-t-e-r/sub2api
  SOURCE_COMMIT: bc8d21624887f3f76f91347a67b283cbdbea0938
  VERSION: antigravity-quota-bc8d21624
  WORKFLOW_FILE: .github/workflows/publish-antigravity-quota-image.yml

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged workflow commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify immutable source boundary
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          expected_ref="refs/tags/xter-image-antigravity-quota-bc8d21624"
          [[ "${GITHUB_REF}" == "${expected_ref}" ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]

          read -r -a lineage <<< "$(git rev-list --parents -n 1 HEAD)"
          [[ ${#lineage[@]} -eq 2 ]]
          parent_commit="${lineage[1]}"
          [[ "${parent_commit}" == "${SOURCE_COMMIT}" ]]

          mapfile -t changed_files < <(git diff --no-renames --name-only "${parent_commit}" HEAD --)
          [[ ${#changed_files[@]} -eq 1 ]]
          [[ "${changed_files[0]}" == "${WORKFLOW_FILE}" ]]

          echo "source_commit=${parent_commit}" >> "${GITHUB_OUTPUT}"
          git checkout --detach "${parent_commit}"
          [[ "$(git rev-parse HEAD)" == "${SOURCE_COMMIT}" ]]

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/x-t-e-r/sub2api:antigravity-quota-bc8d21624
            ghcr.io/x-t-e-r/sub2api:latest
          labels: |
            org.opencontainers.image.source=https://github.com/X-T-E-R/sub2api
            org.opencontainers.image.revision=${{ steps.verify.outputs.source_commit }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=Sub2API Antigravity quota improvements
            org.opencontainers.image.description=Compact Antigravity quotas with project discovery and account-scoped OAuth refresh
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ steps.verify.outputs.source_commit }}
          cache-from: |
            type=gha,scope=antigravity-quota-bc8d21624
            type=gha,scope=codex-antigravity-c50d127f8
          cache-to: type=gha,mode=max,scope=antigravity-quota-bc8d21624
          provenance: false
          sbom: false

      - name: Verify published image
        shell: bash
        run: |
          set -euo pipefail

          pinned="${IMAGE_NAME}:${VERSION}"
          latest="${IMAGE_NAME}:latest"
          expected_digest="${{ steps.build.outputs.digest }}"

          resolve_digest() {
            local ref="$1"
            local digest=""
            for _ in $(seq 1 12); do
              digest="$(docker buildx imagetools inspect "${ref}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
              [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] && break
              sleep 5
            done
            printf '%s\n' "${digest}"
          }

          pinned_digest="$(resolve_digest "${pinned}")"
          latest_digest="$(resolve_digest "${latest}")"
          [[ "${pinned_digest}" == "${expected_digest}" ]]
          [[ "${latest_digest}" == "${expected_digest}" ]]

          docker buildx imagetools inspect --raw "${pinned}" > index.json
          jq -e '
            (.mediaType == "application/vnd.oci.image.index.v1+json" or
             .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json") and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length == 1) and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length == 1)
          ' index.json >/dev/null

          for arch in amd64 arm64; do
            manifest_digest="$(jq -r --arg arch "${arch}" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' index.json)"
            docker buildx imagetools inspect "${IMAGE_NAME}@${manifest_digest}" --format '{{json .Image}}' > "${arch}.json"
            jq -e \
              --arg source "https://github.com/X-T-E-R/sub2api" \
              --arg revision "${SOURCE_COMMIT}" \
              --arg version "${VERSION}" \
              '.config.Labels["org.opencontainers.image.source"] == $source and
               .config.Labels["org.opencontainers.image.revision"] == $revision and
               .config.Labels["org.opencontainers.image.version"] == $version' \
              "${arch}.json" >/dev/null
          done

          {
            echo '### Published images'
            echo "- \`${pinned}\`"
            echo "- \`${latest}\`"
            echo "- Source: \`${SOURCE_COMMIT}\`"
            echo "- Digest: \`${expected_digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
